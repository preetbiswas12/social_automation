<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>views automation</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #30363d; --text: #e6edf3;
    --dim: #8b949e; --ok: #3fb950; --bad: #f85149; --warn: #d29922; --accent: #58a6ff;
    /* Without this the browser assumes a light UI and draws the native select
       arrow, scrollbars and number spinners for a white background, so the
       arrow vanishes against the dark panel. */
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); background-color: var(--bg);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 18px 22px; border-bottom: 1px solid var(--line); background: var(--panel);
    position: sticky; top: 0; z-index: 5;
  }
  h1 { margin: 0; font-size: 18px; font-weight: 600; }
  h1 small { color: var(--dim); font-weight: 400; margin-left: 8px; }
  main { padding: 22px; max-width: 1180px; margin: 0 auto; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px; margin-bottom: 18px;
  }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .grow { flex: 1 1 240px; }
  .badge {
    display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 12px;
    font-weight: 600; border: 1px solid transparent;
  }
  .badge.ok   { color: var(--ok);   border-color: var(--ok); }
  .badge.bad  { color: var(--bad);  border-color: var(--bad); }
  .badge.warn { color: var(--warn); border-color: var(--warn); }
  .badge.idle { color: var(--dim);  border-color: var(--line); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 14px 0; }
  .stat { background: #0d1117; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .stat .label { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .4px; }
  .stat .value { font-size: 16px; font-weight: 600; margin-top: 3px; word-break: break-word; }
  label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; color: var(--dim); margin-bottom: 4px; }
  input[type=text], input[type=number] {
    width: 100%; background: #0d1117; border: 1px solid var(--line); color: var(--text);
    border-radius: 6px; padding: 8px 10px; font: inherit; font-size: 13px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  .chk { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text); text-transform: none; letter-spacing: 0; }
  button {
    background: #21262d; color: var(--text); border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 14px; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
  }
  button:hover:not(:disabled) { background: #30363d; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #04121f; }
  button.danger { color: var(--bad); }
  .note { color: var(--dim); font-size: 12px; margin-top: 6px; }
  .warnbox { border: 1px solid var(--warn); border-radius: 8px; padding: 9px 12px; margin: 10px 0; font-size: 13px; }
  pre {
    background: #0d1117; border: 1px solid var(--line); border-radius: 8px; padding: 12px;
    max-height: 300px; overflow: auto; font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap; word-break: break-word; margin: 0;
  }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--dim); font-weight: 600; text-transform: uppercase; font-size: 10px; letter-spacing: .4px; }
  td.msg { color: var(--dim); }
  #flash { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 20; }
  .toast { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent);
           border-radius: 8px; padding: 10px 14px; max-width: 380px; font-size: 13px;
           box-shadow: 0 6px 20px #0008; }
  .toast.err { border-left-color: var(--bad); }
  .toast.ok  { border-left-color: var(--ok); }
  .banner { border: 1px solid var(--bad); border-radius: 8px; padding: 10px 14px; margin-bottom: 18px; }
  details > summary { cursor: pointer; color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .4px; margin: 14px 0 8px; }
  h2 { font-size: 15px; margin: 0; }
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>views automation <small id="subtitle">loading...</small></h1>
    <div class="grow"></div>
    <button id="refresh">Refresh</button>
  </div>
</header>
<main>
  <div id="banner"></div>
  <div id="notices"></div>

  <div class="card" id="addCard">
    <h2>Add a session</h2>
    <div class="note" style="margin:4px 0 12px">
      One session is one reel on one page, running on its own timer. Give each
      one a different reel - Zefame refuses the same reel twice inside its
      window, so two sessions on the same reel means one of them is wasted.
    </div>
    <div class="row" style="align-items:flex-end">
      <div class="grow">
        <label>Name</label>
        <input type="text" id="newName" placeholder="reel 1" maxlength="80">
      </div>
      <div class="grow">
        <label>Page</label>
        <select id="newService" style="width:100%;background:#0d1117;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:8px 10px;font:inherit;font-size:13px">
          <option value="">choose a page</option>
        </select>
      </div>
      <div class="grow">
        <label>Reel / post link</label>
        <input type="text" id="newReel" placeholder="https://www.instagram.com/reel/...">
      </div>
    </div>
    <div class="row" style="align-items:flex-end; margin-top:12px">
      <div style="width:150px">
        <label>Interval (min)</label>
        <input type="number" id="newInterval" min="0" step="0.5" value="6">
      </div>
      <div style="width:150px">
        <label>Wait after click (s)</label>
        <input type="number" id="newWait" min="0" step="5" value="70">
      </div>
      <div style="width:150px">
        <label>Max sessions (0 = forever)</label>
        <input type="number" id="newTimes" min="0" step="1" value="0">
      </div>
      <label class="chk"><input type="checkbox" id="newStart" checked> start it now</label>
      <div class="grow"></div>
      <button class="primary" id="createBtn">Create session</button>
    </div>
    <div class="note" id="newHint"></div>
  </div>

  <div id="targets"></div>

  <div id="empty" class="card" style="display:none">
    No sessions yet. Add one above.
  </div>
</main>
<div id="flash"></div>

<script>
const $ = (sel) => document.querySelector(sel);
const state = { targets: [], now: null };

const fmtDuration = (ms) => {
  if (ms == null) return '-';
  const s = Math.max(0, Math.round(ms / 1000));
  const m = Math.floor(s / 60);
  return m ? `${m}m ${s % 60}s` : `${s}s`;
};
const since = (iso) => {
  if (!iso) return '-';
  const s = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  return `${Math.floor(s / 3600)}h ago`;
};
const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function toast(message, kind = '') {
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.textContent = message;
  $('#flash').append(el);
  setTimeout(() => el.remove(), 6000);
}

async function api(path, options) {
  // Carry a ?token= login into the API calls. Without this, opening the page
  // that way authenticates the document but every fetch underneath it is
  // unauthorised, so the page loads and then shows "cannot reach the server".
  // HTTP Basic does not need this: the browser resends the credentials itself.
  const token = new URLSearchParams(location.search).get('token');
  const url = token && path.startsWith('/')
    ? path + (path.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(token)
    : path;
  const res = await fetch(url, {
    ...options,
    headers: { 'content-type': 'application/json', ...(options?.headers ?? {}) },
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
  return body;
}

/* ------------------------------------------------------------------ render */

function countdown(target) {
  const next = target.status?.nextSessionAt;
  if (!next) return '-';
  const left = new Date(next).getTime() - Date.now();
  if (left <= 0) return 'due now';
  return `in ${fmtDuration(left)}`;
}

function resultBadge(target) {
  const state_ = target.status?.state;
  if (state_ === 'running') return '<span class="badge ok">running</span>';
  if (state_ === 'finished') return '<span class="badge idle">finished</span>';
  if (state_ && state_.endsWith('-finished')) return `<span class="badge idle">${esc(state_)}</span>`;
  if (!target.running) return '<span class="badge idle">stopped</span>';
  return '<span class="badge warn">starting</span>';
}

/** Which collapsible panes the user has open, as "id:section" keys.
 *
 *  The page re-reads the server every 5 seconds. Rebuilding every card from
 *  scratch each time snapped each <details> shut again, so the open/closed
 *  state is remembered here and written back out on the next render. */
const openPanes = new Set();

const paneKey = (id, section) => `${id}:${section}`;

function cardHtml(target) {
  const s = target.status ?? {};
  const lastOk = s.lastResult === 'success';
  const warnings = (target.warnings ?? []).map((w) => `<div class="warnbox">${esc(w)}</div>`).join('');
  const id = esc(target.id);

  return `
  <div class="card" id="card-${id}">
    <div class="row">
      <h2>${esc(target.name || target.id)}</h2>
      ${resultBadge(target)}
      ${target.running ? `<span class="badge idle">pid ${esc(target.pid)}</span>` : ''}
      <div class="grow"></div>
      <button class="primary" data-act="start" data-id="${id}" ${target.running ? 'disabled' : ''}>Start</button>
      <button class="danger" data-act="stop" data-id="${id}" ${target.running ? '' : 'disabled'}>Stop</button>
      <button data-act="once" data-id="${id}" ${target.running ? 'disabled' : ''}>Run once</button>
      <button class="danger" data-act="delete" data-id="${id}">Delete</button>
    </div>

    ${warnings}

    <div class="stats">
      <div class="stat"><div class="label">Last result</div><div class="value">
        ${s.lastResult ? `<span class="badge ${lastOk ? 'ok' : 'bad'}">${esc(s.lastResult)}</span>` : '-'}
      </div></div>
      <div class="stat"><div class="label">Next session</div><div class="value" data-cd="${esc(s.nextSessionAt ?? '')}">${esc(countdown(target))}</div></div>
      <div class="stat"><div class="label">Sessions</div><div class="value">${esc(s.sessionsRun ?? 0)} <small style="color:var(--dim)">/ ${esc(s.failures ?? 0)} failed</small></div></div>
      <div class="stat"><div class="label">Per order</div><div class="value">${
        target.quantityPerSession
          ? `${esc(target.quantityPerSession)} <small style="color:var(--dim)">${esc(target.unit ?? '')}</small>`
          : esc(s.lastViews ?? '-')
      }</div></div>
      <div class="stat"><div class="label">Restarts (1h)</div><div class="value">${esc(target.restarts ?? 0)}</div></div>
      <div class="stat"><div class="label">Status written</div><div class="value" style="font-size:13px" data-since="${esc(s.updatedAt ?? '')}">${esc(since(s.updatedAt))}</div></div>
    </div>

    <div class="note" style="margin-bottom:14px">${esc(s.lastMessage ?? 'nothing reported yet')}</div>

    <details data-key="${paneKey(target.id, 'settings')}" ${openPanes.has(paneKey(target.id, 'settings')) ? 'open' : ''}>
      <summary>Settings</summary>
      <div class="row" style="align-items:flex-end">
        <div class="grow">
          <label>Page URL</label>
          <input type="text" data-field="startUrl" data-id="${id}" data-sent="${esc(target.startUrl)}" value="${esc(target.startUrl)}">
        </div>
        <div class="grow">
          <label>Reel / post link to paste</label>
          <input type="text" data-field="reelUrl" data-id="${id}" data-sent="${esc(target.reelUrl)}" value="${esc(target.reelUrl)}">
        </div>
      </div>
      <div class="row" style="align-items:flex-end; margin-top:12px">
        <div style="width:150px">
          <label>Interval (min)</label>
          <input type="number" min="0" step="0.5" data-field="cooldownSeconds" data-id="${id}"
                 data-sent="${esc(target.cooldownSeconds / 60)}" value="${esc(target.cooldownSeconds / 60)}">
        </div>
        <div style="width:150px">
          <label>Wait after click (s)</label>
          <input type="number" min="0" step="5" data-field="waitSeconds" data-id="${id}"
                 data-sent="${esc(target.waitSeconds)}" value="${esc(target.waitSeconds)}">
        </div>
        <div style="width:150px">
          <label>Max sessions (0 = forever)</label>
          <input type="number" min="0" step="1" data-field="timesMax" data-id="${id}"
                 data-sent="${esc(target.timesMax)}" value="${esc(target.timesMax)}">
        </div>
        <div>
          <label class="chk"><input type="checkbox" data-field="enabled" data-id="${id}" data-sent="${target.enabled ? '1' : '0'}" ${target.enabled ? 'checked' : ''}> enabled</label>
          <label class="chk" style="margin-top:6px"><input type="checkbox" data-field="autoStart" data-id="${id}" data-sent="${target.autoStart ? '1' : '0'}" ${target.autoStart ? 'checked' : ''}> auto-start</label>
          <label class="chk" style="margin-top:6px"><input type="checkbox" data-field="headless" data-id="${id}" data-sent="${target.headless ? '1' : '0'}" ${target.headless ? 'checked' : ''}> headless</label>
        </div>
        <div class="grow"></div>
        <button class="primary" data-act="save" data-id="${id}">Save</button>
      </div>
      <div class="note">
        Page, reel, interval and wait only change after a restart.
        ${target.siteCooldownSeconds ? `The site itself allows one order every ${fmtDuration(target.siteCooldownSeconds * 1000)} for this service.` : ''}
      </div>
    </details>

    <details data-key="${paneKey(target.id, 'log')}" ${openPanes.has(paneKey(target.id, 'log')) ? 'open' : ''}>
      <summary>Log and history</summary>
      <div class="row" style="margin:8px 0; align-items:center">
        <button data-act="logs" data-id="${id}">Reload log</button>
        <button data-act="history" data-id="${id}">Reload history</button>
        <span class="note" style="margin:0">refreshes by itself every 5s while this is open</span>
      </div>
      <pre id="log-${id}">(not loaded)</pre>
      <pre id="hist-${id}" style="max-height:200px; display:none"></pre>
    </details>
  </div>`;
}

/** Has the user typed into this card something the server has not been told
 *  about? A card in this state must not be rebuilt out from under the cursor,
 *  which is what made editing a setting feel impossible. */
function cardIsDirty(card) {
  return [...card.querySelectorAll('[data-field]')].some((el) => {
    const now = el.type === 'checkbox' ? (el.checked ? '1' : '0') : el.value;
    return String(now) !== String(el.dataset.sent ?? '');
  });
}

/** The countdown and "x ago" are the only parts that move with nothing but the
 *  clock, so they are updated in place rather than forcing a rebuild. */
function tickLive(root) {
  const now = Date.now();
  for (const el of root.querySelectorAll('[data-cd]')) {
    if (!el.dataset.cd) { el.textContent = '-'; continue; }
    const left = new Date(el.dataset.cd).getTime() - now;
    el.textContent = left <= 0 ? 'due now' : `in ${fmtDuration(left)}`;
  }
  for (const el of root.querySelectorAll('[data-since]')) {
    el.textContent = since(el.dataset.since);
  }
}

/** Everything a card renders, so a rebuild can be skipped when none of it has
 *  moved. Deliberately excludes nothing time based: nextSessionAt and updatedAt
 *  only change when the worker writes new status, and the parts that move on
 *  their own (the countdown, "x ago") are ticked in place by tickLive(). */
function cardSignature(target) {
  return JSON.stringify([target, target.warnings ?? []]);
}

/** The card for one target.
 *
 *  Rebuilt whenever the server data moves, so status, badges and warnings stay
 *  current. Two things are carried across the rebuild so a refresh is invisible:
 *  any unsaved edit in the form, and the log and history panes. A rebuild with
 *  no changes at all is skipped, and the countdown and "x ago" are ticked in
 *  place by tickLive() rather than by rebuilding. */
function cardNode(target, existing) {
  const sig = cardSignature(target);
  if (existing && existing.dataset.sig === sig && !cardIsDirty(existing)) return existing;

  // A card that is appearing for the first time with warnings starts with its
  // panes already open, so the warning sits next to the thing you would change
  // to fix it. Recorded in openPanes so the next rebuild does not shut it.
  if (!existing && target.warnings?.length) {
    openPanes.add(paneKey(target.id, 'settings'));
    openPanes.add(paneKey(target.id, 'log'));
  }

  // Was a field focused? Rebuilding replaces the element, so the caret has to be
  // put back or the next keystroke lands nowhere.
  const active = existing?.contains(document.activeElement)
    ? document.activeElement.dataset.field ?? null
    : null;
  const caret = active && document.activeElement.selectionStart != null
    ? [document.activeElement.selectionStart, document.activeElement.selectionEnd]
    : null;

  const template = document.createElement('template');
  template.innerHTML = cardHtml(target).trim();
  const node = template.content.firstElementChild;
  node.dataset.sig = sig;

  if (existing) {
    // Carry over unsaved edits. data-sent keeps the server's value on purpose,
    // so the field still counts as dirty and the next rebuild preserves it too.
    const before = new Map();
    for (const el of existing.querySelectorAll('[data-field]')) before.set(el.dataset.field, el);
    for (const el of node.querySelectorAll('[data-field]')) {
      const old = before.get(el.dataset.field);
      if (!old) continue;
      if (el.type === 'checkbox') {
        if (old.checked !== el.checked) el.checked = old.checked;
      } else if (old.value !== el.value) {
        el.value = old.value;
      }
    }
    for (const prefix of ['log-', 'hist-']) {
      const was = existing.querySelector(`pre[id^="${prefix}"]`);
      const now = node.querySelector(`pre[id^="${prefix}"]`);
      if (was && now && was.dataset.loaded) {
        now.textContent = was.textContent;
        now.dataset.loaded = '1';
      }
    }
  }

  if (active) {
    const field = node.querySelector(`[data-field="${active}"]`);
    if (field) {
      field.focus();
      if (caret && field.setSelectionRange) {
        try { field.setSelectionRange(caret[0], caret[1]); } catch { /* number inputs */ }
      }
    }
  }
  return node;
}

function render() {
  $('#subtitle').textContent =
    `${state.targets.length} session(s), ${state.targets.filter((t) => t.running).length} running - ` +
    `updated ${new Date().toLocaleTimeString('en-GB')}`;

  $('#banner').innerHTML = state.usingDefaultPassword ? `
    <div class="warnbox">
      Using the password built into the source, so anyone who can read the repo
      can log in here. Set <code>DASHBOARD_TOKEN</code> in the environment to
      override it - no code change needed.
    </div>` : '';

  $('#notices').innerHTML = (state.notices ?? [])
    .map((n) => `<div class="warnbox">${esc(n.text)}</div>`)
    .join('');

  // Page dropdown: keep whatever is chosen across a 5 second refresh.
  const select = $('#newService');
  if (select && select.options.length <= 1) {
    for (const service of state.services ?? []) {
      const option = document.createElement('option');
      option.value = service.url;
      option.textContent = `${service.label} - ${service.quantity} ${service.unit} every ${Math.round(service.cooldownSeconds / 60)} min`;
      select.append(option);
    }
  }

  // Reconcile the card list one card at a time instead of throwing the whole
  // list away and rebuilding it. Assigning innerHTML here is what used to close
  // every pane and wipe anything half typed, five seconds after you touched it.
  const holder = $('#targets');
  const existing = new Map();
  for (const el of holder.children) existing.set(el.id, el);

  const wanted = state.targets.map((target) => cardNode(target, existing.get(`card-${target.id}`)));
  const keep = new Set(wanted);
  for (const el of [...holder.children]) if (!keep.has(el)) el.remove();
  wanted.forEach((node, i) => {
    if (holder.children[i] !== node) holder.insertBefore(node, holder.children[i] ?? null);
  });

  $('#empty').style.display = state.targets.length ? 'none' : 'block';
  tickLive(holder);
}

/* ------------------------------------------------------------ log streaming */

async function loadLog(id) {
  const el = document.getElementById(`log-${id}`);
  if (!el) return;
  try {
    const body = await api(`/api/logs?target=${encodeURIComponent(id)}&lines=300`);
    // Only follow the tail if the reader is already at the bottom, so scrolling
    // back to read something is not yanked away on the next refresh.
    const pinned = el.scrollTop + el.clientHeight >= el.scrollHeight - 24;
    el.textContent = body.lines.join('\n') || '(no output yet)';
    el.dataset.loaded = '1';
    if (pinned) el.scrollTop = el.scrollHeight;
  } catch (error) {
    el.textContent = `could not load the log: ${error.message}`;
  }
}

async function loadHistory(id) {
  const el = document.getElementById(`hist-${id}`);
  if (!el) return;
  try {
    const body = await api(`/api/runs?target=${encodeURIComponent(id)}&limit=100`);
    el.style.display = body.runs.length ? 'block' : 'none';
    el.textContent = body.runs
      .map((r) => `${r.at}  session ${r.session}  ${r.result}  ${r.views ?? ''}  ${r.message ?? ''}`)
      .join('\n');
    el.dataset.loaded = '1';
  } catch (error) {
    el.textContent = `could not load the history: ${error.message}`;
  }
}

/** Keep every open log pane current. Opening a pane loads it the first time and
 *  then refreshes on the same 5 second tick as the rest of the page, so the log
 *  streams on its own instead of needing "Reload log" clicked every time. */
function refreshOpenPanes() {
  for (const details of document.querySelectorAll('details[data-key$=":log"][open]')) {
    const id = details.dataset.key.split(':')[0];
    const hist = document.getElementById(`hist-${id}`);
    loadLog(id);
    if (hist?.dataset.loaded) loadHistory(id);
  }
}

/* ------------------------------------------------------------------ wiring */

async function loadState() {
  try {
    const data = await api('/api/state');
    state.targets = data.targets;
    state.now = data.now;
    state.authRequired = data.authRequired;
    state.usingDefaultPassword = data.usingDefaultPassword;
    state.services = data.services;
    state.notices = data.notices;
    render();
  } catch (error) {
    $('#subtitle').textContent = `cannot reach the server: ${error.message}`;
  }
}

/** Creating a session, and deleting one, are the two things that stop being
 *  trivial because of a browser process, so they get an explicit confirmation
 *  rather than firing off on a stray click. */
async function createSession() {
  const startUrl = $('#newService').value;
  const reelUrl = $('#newReel').value.trim();
  if (!startUrl) return toast('choose a page first', 'err');
  if (!/^https:\/\//i.test(reelUrl)) return toast('the reel link must be an https URL', 'err');
  if (state.targets.some((t) => t.reelUrl === reelUrl && t.startUrl === startUrl)) {
    return toast('a session on this page is already using that reel', 'err');
  }

  const body = {
    name: $('#newName').value.trim(),
    startUrl,
    reelUrl,
    cooldownSeconds: Number($('#newInterval').value) * 60,
    waitSeconds: Number($('#newWait').value),
    timesMax: Number($('#newTimes').value),
    startNow: $('#newStart').checked,
  };
  try {
    const result = await api('/api/targets', { method: 'POST', body: JSON.stringify(body) });
    toast(result.message, 'ok');
    $('#newName').value = '';
    $('#newReel').value = '';
  } catch (error) {
    toast(error.message, 'err');
  }
  await loadState();
}

async function deleteSession(id) {
  const target = state.targets.find((t) => t.id === id);
  const label = target?.name || id;
  const purge = confirm(
    `Delete "${label}"?\n\n` +
      (target?.running ? 'It is running now, so this will stop it first.\n\n' : '') +
      'Its run history stays in logs/runs.jsonl. Click OK again to also delete its log and status file.',
  );
  if (!purge) return;
  try {
    const query = confirm(`Also delete the log and status file for "${label}"?`) ? '?purge=1' : '';
    await api(`/api/targets/${encodeURIComponent(id)}${query}`, { method: 'DELETE' });
    toast(`${label} deleted`, 'ok');
  } catch (error) {
    toast(`${label}: ${error.message}`, 'err');
  }
  await loadState();
}

async function act(act_, id) {
  const target = state.targets.find((t) => t.id === id);
  try {
    if (act_ === 'save') {
      const patch = {};
      const fields = document.querySelectorAll(`[data-id="${CSS.escape(id)}"][data-field]`);
      fields.forEach((el) => {
        const key = el.dataset.field;
        patch[key] = el.type === 'checkbox' ? el.checked : el.type === 'number' ? Number(el.value) : el.value;
      });
      const body = await api(`/api/targets/${encodeURIComponent(id)}`, {
        method: 'PUT',
        body: JSON.stringify(patch),
      });
      toast(body.message, 'ok');
      if (body.restartNeeded && target?.running) {
        toast('Restart the workflow for the new settings to take effect.', 'err');
      }
      // The server has these values now, so the card is no longer holding
      // unsaved edits. Without this it would stay frozen against rebuilds
      // until the next poll happened to land on a clean comparison.
      fields.forEach((el) => {
        const value = el.type === 'checkbox' ? (el.checked ? '1' : '0') : el.value;
        el.dataset.sent = String(value);
      });
    } else if (act_ === 'logs') {
      await loadLog(id);
    } else if (act_ === 'history') {
      await loadHistory(id);
    } else if (act_ === 'delete') {
      await deleteSession(id);
      return;
    } else {
      await api(`/api/targets/${encodeURIComponent(id)}/${act_}`, { method: 'POST' });
      toast(`${id}: ${act_} sent`, 'ok');
    }
  } catch (error) {
    toast(`${id}: ${error.message}`, 'err');
  }
  await loadState();
}

document.addEventListener('click', (event) => {
  const button = event.target.closest('button[data-act]');
  if (!button) return;
  act(button.dataset.act, button.dataset.id);
});

/* Remember which panes are open, and load a log the first time its pane is
 * opened. `toggle` does not bubble, so this listens in the capture phase. */
document.addEventListener('toggle', (event) => {
  const details = event.target;
  if (!(details instanceof HTMLDetailsElement) || !details.dataset.key) return;
  if (details.open) {
    openPanes.add(details.dataset.key);
    if (details.dataset.key.endsWith(':log')) {
      const id = details.dataset.key.slice(0, -':log'.length);
      loadLog(id);
      const hist = document.getElementById(`hist-${id}`);
      if (hist?.dataset.loaded) loadHistory(id);
    }
  } else {
    openPanes.delete(details.dataset.key);
  }
}, true);

$('#refresh').addEventListener('click', loadState);
$('#createBtn').addEventListener('click', createSession);
loadState();
// State first, then whatever log panes are open, so the panes refresh on the
// same tick instead of trailing a poll behind.
setInterval(() => { loadState().then(refreshOpenPanes); }, 5000);
</script>
</body>
</html>
