# Render blueprint for views-automation.
#
# This is a web service rather than a background worker, because the dashboard
# has to answer HTTP. The workflows themselves are child processes of the same
# process, so nothing else is needed on the outside.
#
#   render blueprint launch
services:
  - type: web
    name: views-automation
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    # A dead browser is recoverable, so restarting is always the right answer.
    # If the whole service is crash-looping, see MAX_RESTARTS in server.js.
    restartPolicy: always
    # Unauthenticated on purpose. Render polls it and it reveals nothing.
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: HEADLESS
        value: "1"
      # No secret needed to deploy. The dashboard password lives in server.js,
      # so there is nothing here for Render to prompt you for.
      #
      # To change the password without editing code, add DASHBOARD_TOKEN in the
      # Render dashboard and paste anything in. It overrides the built-in one.
      #
      # CONFIG_PATH is deliberately not listed. It is only needed to keep
      # config.json on a Persistent Disk, and asking for it at deploy time
      # invites a typo that stops the server loading its config. Set it by
      # hand if you attach a disk at /app/data.
