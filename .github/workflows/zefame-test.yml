name: Zefame test (one-off)

# Deliberately NOT scheduled: this is the experiment that decides whether
# GitHub Actions is viable at all. It does what a local headed run does - a
# real browser under a virtual display (xvfb-run) - so if the site's finalize
# step accepts it, we know the platform can work and only then do we design a
# schedule around it.
#
# Run it:  Actions -> "Zefame test (one-off)" -> Run workflow -> pick a service.
#
# Gotchas this job was written around:
#   - Each run is a brand-new browser, so results here may differ from your PC
#     (the site mints a new device id on every launch).
#   - Runner egress IPs are shared Microsoft datacenter ranges. If Zefame's
#     Cloudflare/Turnstile scores those harshly, this run will end in
#     "Order error" and that is the answer - the platform is off the table.
#   - A job must end: --max-wait caps the wait so it can never hang a slot.

on:
  workflow_dispatch:
    inputs:
      service:
        description: Which service to test (views = 300 views / 6 min; likes = 10 / 31 min)
        required: true
        default: views
        type: choice
        options:
          - views
          - likes
      max_wait_seconds:
        description: Cap for the post-click wait, in seconds (prevents a hung job)
        required: false
        default: '300'
        type: string

jobs:
  order:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependencies
        run: |
          npm ci
          # Runners ship xvfb-run by default; this line is a no-op if so and a
          # fallback if the image ever stops bundling it.
          command -v xvfb-run || sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify the form selectors (no order placed)
        run: xvfb-run -a node ${{ github.event.inputs.service }}.js --check

      - name: One order, headed under the virtual display
        run: xvfb-run -a node ${{ github.event.inputs.service }}.js --sessions=1 --max-wait=${{ github.event.inputs.max_wait_seconds }}

      - name: Upload screenshots if the run failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: shots/
          if-no-files-found: ignore