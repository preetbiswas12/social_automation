name: Zefame likes

# Triggered only from outside (see pinger.sh), so the cadence is whatever the
# pinger wants - GitHub's own schedule trigger cannot express an exact
# 31-minute interval (cron minute patterns alternate 31/29, and the 29-minute
# gap would trip the site's own 30-minute per-link limit every other run).
#
# Each run: one real 10-like order, in a headed browser under xvfb-run. First
# manual dispatch is the experiment - if it lands "Order error", the shared
# datacenter IP is blocked and Actions is off the table.

on:
  workflow_dispatch:

concurrency:
  group: zefame-likes
  cancel-in-progress: false

jobs:
  order:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependencies
        run: |
          npm ci
          command -v xvfb-run || sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: One order, headed under the virtual display
        # No --max-wait: the session waits until the site shows success or an
        # error page, however long that takes. timeout-minutes above is the
        # hard backstop so a run that never gets a result still ends.
        run: xvfb-run -a node likes.js --sessions=1

      - name: Upload screenshots if the run failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: shots/
          if-no-files-found: ignore